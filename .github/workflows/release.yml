name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -e . pyinstaller
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ProxyLens proxylens_gui.py
      - name: Create checksums
        shell: pwsh
        run: (Get-FileHash dist/ProxyLens.exe -Algorithm SHA256).Hash.ToLower() + "  ProxyLens.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ProxyLens.exe
            dist/SHA256SUMS.txt

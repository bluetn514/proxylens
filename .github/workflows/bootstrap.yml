name: Complete initial release

on:
  push:
    branches: ["main"]
    paths:
      - "ProxyLens-v0.1.0-source.zip"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source package
        run: |
          unzip -o ProxyLens-v0.1.0-source.zip
          rm -f ProxyLens-v0.1.0-source.zip
          rm -f .github/workflows/test.yml .github/workflows/release.yml
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release ProxyLens 0.1.0"
          git push origin main

  build-windows:
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -e . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ProxyLens proxylens_gui.py
      - name: Create checksum
        shell: pwsh
        run: (Get-FileHash dist/ProxyLens.exe -Algorithm SHA256).Hash.ToLower() + "  ProxyLens.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish v0.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v0.1.0 dist/ProxyLens.exe dist/SHA256SUMS.txt --target main --title "ProxyLens v0.1.0" --notes "First public release. Includes the Windows portable executable and SHA-256 checksum."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxylens"
version = "0.1.0"
description = "A small Windows network and proxy diagnostic tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ProxyLens contributors" }]
keywords = ["windows", "proxy", "network", "diagnostics", "dns"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
proxylens = "proxylens.cli:main"
proxylens-gui = "proxylens.gui:main"

[tool.setuptools.packages.find]
include = ["proxylens*"]
